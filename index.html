<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gracelyn Pablo Bahel | Portfolio</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f9ff;
      color: #222;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
    }

    .nav-container {
      max-width: 1150px;
      margin: auto;
      padding: 18px 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      color: #222;
    }

    .logo span {
      color: #6c63ff;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      font-weight: 600;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #6c63ff;
    }

    .menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: 90vh;
      display: flex;
      align-items: center;
      padding: 80px 25px;

      background: linear-gradient(
        135deg,
        #f8f9ff,
        #eeeeff
      );
    }

    .hero-container {
      max-width: 1150px;
      width: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 50px;
    }

    .hero-text {
      max-width: 650px;
    }

    .hello {
      color: #6c63ff;
      font-weight: bold;
      font-size: 18px;
    }

    .hero h1 {
      font-size: 55px;
      line-height: 1.1;
      margin: 12px 0;
    }

    .hero h1 span {
      color: #6c63ff;
    }

    .hero h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .hero-description {
      color: #666;
      margin-bottom: 25px;
    }

    .hero-buttons {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      border: none;
    }

    .primary-btn {
      background: #6c63ff;
      color: white;
    }

    .primary-btn:hover {
      background: #5148e5;
      transform: translateY(-3px);
    }

    .secondary-btn {
      border: 2px solid #6c63ff;
      color: #6c63ff;
    }

    .secondary-btn:hover {
      background: #6c63ff;
      color: white;
    }

    .social-links {
      display: flex;
      gap: 20px;
    }

    .social-links a {
      font-weight: bold;
      color: #555;
    }

    .social-links a:hover {
      color: #6c63ff;
    }

    .profile-container {
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: #6c63ff;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 20px 50px rgba(108, 99, 255, 0.25);
    }

    .profile-placeholder {
      width: 290px;
      height: 290px;
      border-radius: 50%;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 80px;
      color: #6c63ff;
      font-weight: bold;
    }

    /* ================= GENERAL ================= */

    .section {
      padding: 100px 25px;
    }

    .section-container {
      max-width: 1150px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-title p {
      color: #6c63ff;
      font-weight: bold;
    }

    .section-title h2 {
      font-size: 40px;
    }

    .section-title span {
      color: #6c63ff;
    }

    /* ================= ABOUT ================= */

    .about-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .about-text h3 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .about-text p {
      color: #666;
      margin-bottom: 15px;
    }

    .about-text .btn {
      margin-top: 10px;
    }

    .about-cards {
      display: grid;
      gap: 18px;
    }

    .info-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      transition: 0.3s;
    }

    .info-card:hover {
      transform: translateY(-5px);
    }

    .info-card h4 {
      color: #6c63ff;
      margin-bottom: 5px;
    }

    /* ================= EDUCATION ================= */

    .education-section {
      background: #eeeeff;
    }

    .education-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .education-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      transition: 0.3s;
    }

    .education-card:hover {
      transform: translateY(-7px);
    }

    .education-icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .education-card .level {
      color: #6c63ff;
      font-weight: bold;
      font-size: 14px;
    }

    .education-card h3 {
      margin: 8px 0;
    }

    .education-card p {
      color: #666;
    }

    .education-card small {
      color: #888;
    }

    /* ================= PROJECTS ================= */

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .project-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      transition: 0.3s;
    }

    .project-card:hover {
      transform: translateY(-7px);
    }

    .project-image {
      height: 170px;
      background: linear-gradient(135deg, #6c63ff, #918aff);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .project-content {
      padding: 25px;
    }

    .project-content h3 {
      margin-bottom: 10px;
    }

    .project-content p {
      color: #666;
      margin-bottom: 15px;
    }

    .project-tech {
      color: #6c63ff;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .project-buttons {
      display: flex;
      gap: 10px;
    }

    .project-btn {
      background: #6c63ff;
      color: white;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
    }

    .project-btn.outline {
      background: white;
      color: #6c63ff;
      border: 1px solid #6c63ff;
    }

    /* ================= TECH STACK ================= */

    .tech-section {
      background: #eeeeff;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .tech-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      transition: 0.3s;
    }

    .tech-card:hover {
      transform: translateY(-5px);
    }

    .tech-icon {
      width: 60px;
      height: 60px;
      margin: auto auto 15px;

      border-radius: 50%;
      background: #eeeeff;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #6c63ff;
      font-weight: bold;
    }

    .skill-bar {
      height: 8px;
      background: #eee;
      border-radius: 10px;
      margin: 15px 0 8px;
      overflow: hidden;
    }

    .skill-progress {
      height: 100%;
      background: #6c63ff;
      border-radius: 10px;
    }

    .tech-card span {
      color: #777;
      font-size: 13px;
    }

    /* ================= CONTACT ================= */

    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }

    .contact-info h3 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    .contact-info > p {
      color: #666;
      margin-bottom: 30px;
    }

    .contact-item {
      margin-bottom: 20px;
    }

    .contact-item strong {
      color: #6c63ff;
    }

    .contact-item p {
      color: #666;
    }

    .contact-item a {
      color: #666;
    }

    .contact-item a:hover {
      color: #6c63ff;
    }

    .contact-form {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;

      border: 1px solid #ddd;
      border-radius: 7px;

      font-family: Arial, Helvetica, sans-serif;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #6c63ff;
    }

    .error {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 15px;
    }

    .success {
      color: #27ae60;
      font-weight: bold;
      margin-top: 15px;
    }

    /* ================= FOOTER ================= */

    .footer {
      background: #181818;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .footer p {
      color: #ccc;
      margin: 5px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 900px) {

      .hero-container {
        flex-direction: column-reverse;
        text-align: center;
      }

      .hero-buttons,
      .social-links {
        justify-content: center;
      }

      .hero h1 {
        font-size: 43px;
      }

      .about-content,
      .contact-container {
        grid-template-columns: 1fr;
      }

      .education-grid,
      .projects-grid,
      .tech-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {

      .menu-btn {
        display: block;
      }

      .nav-links {
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;

        background: white;

        display: none;
        flex-direction: column;

        text-align: center;
        padding: 20px;

        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08);
      }

      .nav-links.active {
        display: flex;
      }

      .hero {
        padding: 60px 20px;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero h2 {
        font-size: 20px;
      }

      .profile-container {
        width: 240px;
        height: 240px;
      }

      .profile-placeholder {
        width: 215px;
        height: 215px;
        font-size: 60px;
      }

      .section {
        padding: 70px 20px;
      }

      .section-title h2 {
        font-size: 32px;
      }

      .education-grid,
      .projects-grid,
      .tech-grid {
        grid-template-columns: 1fr;
      }

      .hero-buttons {
        flex-direction: column;
      }

      .project-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    /* ================= NAVBAR ================= */

    function Navbar() {

      const [menuOpen, setMenuOpen] = useState(false);

      const closeMenu = () => {
        setMenuOpen(false);
      };

      return (
        <nav className="navbar">

          <div className="nav-container">

            <a href="#home" className="logo">
              GB<span>.</span>
            </a>

            <button
              className="menu-btn"
              onClick={() => setMenuOpen(!menuOpen)}
            >
              ☰
            </button>

            <ul className={`nav-links ${menuOpen ? "active" : ""}`}>

              <li>
                <a href="#home" onClick={closeMenu}>
                  Home
                </a>
              </li>

              <li>
                <a href="#about" onClick={closeMenu}>
                  About
                </a>
              </li>

              <li>
                <a href="#education" onClick={closeMenu}>
                  Education
                </a>
              </li>

              <li>
                <a href="#projects" onClick={closeMenu}>
                  Projects
                </a>
              </li>

              <li>
                <a href="#techstack" onClick={closeMenu}>
                  Tech Stack
                </a>
              </li>

              <li>
                <a href="#contact" onClick={closeMenu}>
                  Contact
                </a>
              </li>

            </ul>

          </div>

        </nav>
      );
    }

    /* ================= HOME ================= */

    function Home() {

      return (
        <section id="home" className="hero">

          <div className="hero-container">

            <div className="hero-text">

              <p className="hello">
                Hello, I'm
              </p>

              <h1>
                Gracelyn <span>Bahel</span>
              </h1>

              <h2>
                Bachelor of Science in Information Technology Student
              </h2>

              <p className="hero-description">
                I am a BSIT student who enjoys learning about web development,
                technology, and creating simple digital solutions.
              </p>

              <div className="hero-buttons">

                <a
                  href="#projects"
                  className="btn primary-btn"
                >
                  View My Projects
                </a>

                <a
                  href="#contact"
                  className="btn secondary-btn"
                >
                  Contact Me
                </a>

              </div>

              <div className="social-links">

                <a
                  href="https://github.com/graciee-hub"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  GitHub
                </a>

                <a
                  href="https://facebook.com/grislyn.pablo.bahel"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Facebook
                </a>

              </div>

            </div>

            <div className="profile-container">

              <div className="profile-placeholder">
                GB
              </div>

            </div>

          </div>

        </section>
      );
    }

    /* ================= ABOUT ================= */

    function About() {

      return (
        <section id="about" className="section">

          <div className="section-container">

            <div className="section-title">

              <p>
                Get to know me
              </p>

              <h2>
                About <span>Me</span>
              </h2>

            </div>

            <div className="about-content">

              <div className="about-text">

                <h3>
                  Who I Am
                </h3>

                <p>
                  I am Gracelyn P. Bahel, a Bachelor of Science in Information
                  Technology student who is interested in web development,
                  programming, and learning new technologies.
                </p>

                <p>
                  I enjoy improving my skills, solving problems, exploring new
                  ideas, and creating simple and useful digital solutions.
                </p>

                <p>
                  My goal in life is to become successful in my career, improve
                  my skills, and have a stable and happy life. I want to make
                  my family proud and use my knowledge to help others.
                </p>

                <a href="#" className="btn primary-btn">
                  Download CV
                </a>

              </div>

              <div className="about-cards">

                <div className="info-card">

                  <h4>
                    Career Goal
                  </h4>

                  <p>
                    Become a professional web developer, improve my skills,
                    and build a stable future.
                  </p>

                </div>

                <div className="info-card">

                  <h4>
                    Interests
                  </h4>

                  <p>
                    Learning new things, improving my skills, exploring
                    technology, and discovering new ideas.
                  </p>

                </div>

                <div className="info-card">

                  <h4>
                    Focus
                  </h4>

                  <p>
                    Creating simple, useful, and user-friendly digital
                    solutions while improving my programming skills.
                  </p>

                </div>

              </div>

            </div>

          </div>

        </section>
      );
    }

    /* ================= EDUCATION ================= */

    function Education() {

      const education = [

        {
          level: "College",
          school: "Nueva Vizcaya State University",
          course: "Bachelor of Science in Information Technology",
          location: "Bayombong Campus"
        },

        {
          level: "Senior High School",
          school: "Ambaguio High School",
          course: "Humanities and Social Sciences (HUMSS)",
          location: "Uubi, Poblacion, Ambaguio, Nueva Vizcaya"
        },

        {
          level: "Junior High School",
          school: "Natcak National High School",
          course: "Junior High School",
          location: "Banihal, Natcak, Camandag, Asipulo, Ifugao"
        },

        {
          level: "Elementary School",
          school: "Ammoweg Elementary School",
          course: "Elementary Education",
          location: "Lower Ammoweg, Ambaguio, Nueva Vizcaya"
        }

      ];

      return (

        <section
          id="education"
          className="section education-section"
        >

          <div className="section-container">

            <div className="section-title">

              <p>
                My academic journey
              </p>

              <h2>
                My <span>Education</span>
              </h2>

            </div>

            <div className="education-grid">

              {education.map((item, index) => (

                <div
                  className="education-card"
                  key={index}
                >

                  <div className="education-icon">
                    🎓
                  </div>

                  <span className="level">
                    {item.level}
                  </span>

                  <h3>
                    {item.school}
                  </h3>

                  <p>
                    {item.course}
                  </p>

                  <small>
                    {item.location}
                  </small>

                </div>

              ))}

            </div>

          </div>

        </section>
      );
    }

    /* ================= PROJECTS ================= */

    function Projects() {

      const projects = [

        {
          title: "HTML Web Design",
          description:
            "Creating simple and attractive websites using HTML.",
          tech:
            "HTML"
        },

        {
          title: "Responsive Development",
          description:
            "Creating websites that work well on phones, tablets, and computers.",
          tech:
            "HTML • CSS"
        }

      ];

      return (

        <section id="projects" className="section">

          <div className="section-container">

            <div className="section-title">

              <p>
                My recent work
              </p>

              <h2>
                My <span>Projects</span>
              </h2>

            </div>

            <div className="projects-grid">

              {projects.map((project, index) => (

                <div
                  className="project-card"
                  key={index}
                >

                  <div className="project-image">
                    Project {index + 1}
                  </div>

                  <div className="project-content">

                    <h3>
                      {project.title}
                    </h3>

                    <p>
                      {project.description}
                    </p>

                    <div className="project-tech">
                      {project.tech}
                    </div>

                    <div className="project-buttons">

                      <a
                        href="#"
                        className="project-btn"
                      >
                        View Project
                      </a>

                      <a
                        href="#"
                        className="project-btn outline"
                      >
                        Source Code
                      </a>

                    </div>

                  </div>

                </div>

              ))}

            </div>

          </div>

        </section>
      );
    }

    /* ================= TECH STACK ================= */

    function TechStack() {

      const technologies = [

        {
          name: "HTML5",
          icon: "HTML",
          level: "90%"
        },

        {
          name: "CSS",
          icon: "CSS",
          level: "85%"
        },

        {
          name: "JavaScript",
          icon: "JS",
          level: "80%"
        },

        {
          name: "React.js",
          icon: "⚛",
          level: "75%"
        },

        {
          name: "Bootstrap",
          icon: "B",
          level: "80%"
        },

        {
          name: "MySQL",
          icon: "SQL",
          level: "75%"
        },

        {
          name: "Java",
          icon: "☕",
          level: "70%"
        },

        {
          name: "Git/GitHub",
          icon: "Git",
          level: "75%"
        }

      ];

      return (

        <section
          id="techstack"
          className="section tech-section"
        >

          <div className="section-container">

            <div className="section-title">

              <p>
                Technologies I use
              </p>

              <h2>
                My <span>Tech Stack</span>
              </h2>

            </div>

            <div className="tech-grid">

              {technologies.map((tech, index) => (

                <div
                  className="tech-card"
                  key={index}
                >

                  <div className="tech-icon">
                    {tech.icon}
                  </div>

                  <h3>
                    {tech.name}
                  </h3>

                  <div className="skill-bar">

                    <div
                      className="skill-progress"
                      style={{
                        width: tech.level
                      }}
                    ></div>

                  </div>

                  <span>
                    {tech.level}
                  </span>

                </div>

              ))}

            </div>

          </div>

        </section>
      );
    }

    /* ================= CONTACT ================= */

    function Contact() {

      const [form, setForm] = useState({
        name: "",
        email: "",
        subject: "",
        message: ""
      });

      const [message, setMessage] = useState("");

      const handleChange = (event) => {

        setForm({
          ...form,
          [event.target.name]: event.target.value
        });

        setMessage("");

      };

      const handleSubmit = (event) => {

        event.preventDefault();

        if (
          form.name.trim() === "" ||
          form.email.trim() === "" ||
          form.subject.trim() === "" ||
          form.message.trim() === ""
        ) {

          setMessage(
            "Please complete all fields before submitting."
          );

          return;
        }

        setMessage(
          "Thank you! Your message has been submitted successfully."
        );

        setForm({
          name: "",
          email: "",
          subject: "",
          message: ""
        });

      };

      return (

        <section id="contact" className="section">

          <div className="section-container">

            <div className="section-title">

              <p>
                Let's connect
              </p>

              <h2>
                Contact <span>Me</span>
              </h2>

            </div>

            <div className="contact-container">

              <div className="contact-info">

                <h3>
                  Let's Talk
                </h3>

                <p>
                  Have a project idea or want to connect?
                  Feel free to send me a message.
                </p>

                <div className="contact-item">

                  <strong>
                    Email
                  </strong>

                  <p>
                    <a href="mailto:gracelynbahel@gmail.com">
                      gracelynbahel@gmail.com
                    </a>
                  </p>

                </div>

                <div className="contact-item">

                  <strong>
                    Location
                  </strong>

                  <p>
                    Bayombong, Nueva Vizcaya, Philippines
                  </p>

                </div>

                <div className="contact-item">

                  <strong>
                    GitHub
                  </strong>

                  <p>
                    <a
                      href="https://github.com/graciee-hub"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      github.com/graciee-hub
                    </a>
                  </p>

                </div>

                <div className="contact-item">

                  <strong>
                    Facebook
                  </strong>

                  <p>
                    <a
                      href="https://facebook.com/grislyn.pablo.bahel"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      facebook.com/grislyn.pablo.bahel
                    </a>
                  </p>

                </div>

              </div>

              <form
                className="contact-form"
                onSubmit={handleSubmit}
              >

                <div className="form-group">

                  <label>
                    Name
                  </label>

                  <input
                    type="text"
                    name="name"
                    value={form.name}
                    onChange={handleChange}
                    placeholder="Enter your name"
                  />

                </div>

                <div className="form-group">

                  <label>
                    Email
                  </label>

                  <input
                    type="email"
                    name="email"
                    value={form.email}
                    onChange={handleChange}
                    placeholder="Enter your email"
                  />

                </div>

                <div className="form-group">

                  <label>
                    Subject
                  </label>

                  <input
                    type="text"
                    name="subject"
                    value={form.subject}
                    onChange={handleChange}
                    placeholder="Enter subject"
                  />

                </div>

                <div className="form-group">

                  <label>
                    Message
                  </label>

                  <textarea
                    name="message"
                    rows="5"
                    value={form.message}
                    onChange={handleChange}
                    placeholder="Write your message"
                  ></textarea>

                </div>

                <button
                  type="submit"
                  className="btn primary-btn"
                >
                  Send Message
                </button>

                {message && (

                  <p
                    className={
                      message.startsWith("Thank you")
                        ? "success"
                        : "error"
                    }
                  >
                    {message}
                  </p>

                )}

              </form>

            </div>

          </div>

        </section>
      );
    }

    /* ================= FOOTER ================= */

    function Footer() {

      return (

        <footer className="footer">

          <p>
            © {new Date().getFullYear()} Gracelyn Bahel.
            All Rights Reserved.
          </p>

          <p>
            BSIT Student & Aspiring Web Developer
          </p>

        </footer>
      );
    }

    /* ================= APP ================= */

    function App() {

      return (
        <>
          <Navbar />
          <Home />
          <About />
          <Education />
          <Projects />
          <TechStack />
          <Contact />
          <Footer />
        </>
      );
    }

    /* ================= RENDER ================= */

    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(
      <App />
    );

  </script>

</body>
</html>
